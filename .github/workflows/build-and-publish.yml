name: Build and Archive Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Job 1: Build JAR (No Tests)
  # ============================================================================
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Build with Gradle (skip tests)
        run: ./gradlew assemble

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: solr-mcp-jar
          path: build/libs/solr-mcp-*.jar
          retention-days: 7

  # ============================================================================
  # Job 2: Build Docker Image Artifact (Intel Mac Compatible)
  # ============================================================================
  build-docker-artifact:
    name: Build Docker Artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/v}
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=$VERSION-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image Tarball
        run: |
          # Use linux/amd64 for Intel Macs
          ./gradlew jibBuildTar -x test \
            -Djib.to.image=solr-mcp:${{ steps.meta.outputs.tag }} \
            -Djib.from.platforms=linux/amd64

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solr-mcp-docker-image
          path: build/jib-image.tar
          retention-days: 7

      - name: Summary
        run: |
          echo "### Docker Image Built :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Docker image for Intel (amd64) has been saved as a workflow artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Instructions for your Intel Mac:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`solr-mcp-docker-image\` artifact." >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip the file." >> $GITHUB_STEP_SUMMARY
          echo "3. Open Terminal in that folder and run:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   docker load < jib-image.tar" >> $GITHUB_STEP_SUMMARY
          echo "   docker run -p 8080:8080 solr-mcp:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
